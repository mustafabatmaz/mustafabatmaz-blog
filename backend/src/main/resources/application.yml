spring:
  application:
    name: blog-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:blog}
    # No defaults on purpose: credentials only come from the environment (.env)
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Liquibase; Hibernate only checks it matches the entities
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      # Spring's default is 1MB; requests above these limits get 413 before reaching our code
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}
  # Behind nginx: Tomcat's RemoteIpValve takes the client address from X-Forwarded-For when the request
  # comes from a private-network proxy, so the login rate limit counts clients, not the proxy
  forward-headers-strategy: native

blog:
  auth:
    # Empty when unset, so validation stops the app and names the variable. Without the ":" an unset variable
    # stays as the literal text "${JWT_SECRET}", which passes @NotBlank
    admin-username: ${ADMIN_USERNAME:}
    admin-password-hash: ${ADMIN_PASSWORD_HASH:}
    jwt-secret: ${JWT_SECRET:}
    jwt-ttl: ${JWT_TTL:8h}
    cookie-secure: ${COOKIE_SECURE:true}
  media:
    # Outside the repository, so uploads can never be committed by accident
    dir: ${MEDIA_DIR:${user.home}/.mustafabatmaz-blog/media}
    max-file-size: 5MB
  revalidation:
    # After an admin change public-web is told to rebuild its pages (6a). Without a secret this is off and the
    # pages still refresh within a minute. The default suits IntelliJ next to pnpm dev; compose passes the
    # service name
    url: ${PUBLIC_WEB_URL:http://localhost:3000}
    secret: ${REVALIDATE_SECRET:}

springdoc:
  # Responses are JSON; without this the spec says */* and generated frontend types lose the body type
  default-produces-media-type: application/json
  # Off unless explicitly enabled (local .env turns it on)
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
