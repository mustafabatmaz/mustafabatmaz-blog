databaseChangeLog:
  # Each change lives in its own file under changes/, included here in order.
  # Never edit a changeset that has already run; add a new one instead.
  - include:
      file: changes/0000-baseline.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/0001-profile.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/0002-page.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/0003-uses.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/0004-experience.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/0005-media.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/0006-content.yaml
      relativeToChangelogFile: true
