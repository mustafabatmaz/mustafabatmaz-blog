# admin-web: the SPA's static files, plus /api passed to the backend. One origin, so no CORS and the
# httpOnly auth cookie and the CSRF cookie work exactly as in development (Vite's proxy).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # The backend accepts files up to 5 MB in requests up to 6 MB; nginx's default would stop at 1 MB
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        # Overwritten, not appended: whatever X-Forwarded-For a client sends must not reach the backend,
        # which reads the client address from it for the login rate limit
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # API responses keep the backend's own headers (its CSP is stricter than the page's)
    }

    # Vite puts a content hash in every file name here, so a file never changes
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else is the SPA: unknown paths get index.html and React Router takes over.
    # no-cache: the browser checks for a new index.html (and so new asset names) on every visit.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
