# admin-web: the SPA's static files, plus /api passed to the backend. One origin, so no CORS and the
# httpOnly auth cookie and the CSRF cookie work exactly as in development (Vite's proxy).

# In production Caddy terminates TLS in front of this server and says so in X-Forwarded-Proto; directly
# (locally) there is no such header and the scheme is this connection's own
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Behind Caddy (production) every request comes from Caddy's address. Trust the client address Caddy wrote,
    # but only from the private networks Docker uses: in production only Caddy reaches this server, and locally
    # its port is bound to 127.0.0.1. Caddy itself ignores what a client puts in X-Forwarded-For (7a decision 4)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    # The backend accepts files up to 5 MB in requests up to 6 MB; nginx's default would stop at 1 MB
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://blog-backend:8080;
        proxy_set_header Host $http_host;
        # Overwritten, not appended: the backend reads the client address from it for the login rate limit, so
        # it gets exactly one address, the one realip settled on above
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # API responses keep the backend's own headers (its CSP is stricter than the page's)
    }

    # Vite puts a content hash in every file name here, so a file never changes
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else is the SPA: unknown paths get index.html and React Router takes over.
    # no-cache: the browser checks for a new index.html (and so new asset names) on every visit.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
