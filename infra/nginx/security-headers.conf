# Included in every location that serves the SPA (an add_header in a location drops the server-level ones).
# script-src 'self' is the main guard: the page has no inline scripts. style-src allows inline styles because
# CodeMirror injects its styles at runtime; a nonce would need a per-request value written into the HTML.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
