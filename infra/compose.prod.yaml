# Production differences only (7a decision 2), on top of compose.yaml:
#   docker compose -f infra/compose.yaml -f infra/compose.prod.yaml up -d --build
# The internet reaches the blog through a shared edge Caddy that runs as its own compose project on the server and
# also serves other sites; it reads caddy/blog.caddy. public-web and admin-web join its external edge network under
# blog-* aliases, so names stay unique next to other projects, and they reach the backend by its own blog-backend
# name (compose.yaml): on the shared network a plain "backend" can belong to another project. The other services
# drop the ports compose.yaml publishes for local tools and talk over the compose network only. unless-stopped
# brings everything back after a reboot or a crash.

services:
  postgres:
    restart: unless-stopped
    ports: !reset []

  backend:
    restart: unless-stopped
    ports: !reset []

  public-web:
    restart: unless-stopped
    ports: !reset []
    networks:
      default:
      edge:
        aliases: [blog-public-web]

  admin-web:
    restart: unless-stopped
    ports: !reset []
    networks:
      default:
      edge:
        aliases: [blog-admin-web]

networks:
  # Created once on the server (docker network create edge), shared with the edge Caddy
  edge:
    external: true
